# Accessibility + diff-hygiene gate (grace mode during rollout).
# Consumes the shared reusable workflows from KyLamportLogic/buildlogic-governance.
# Grace mode: runs and reports but does not block merge until branch protection
# is enabled by a human after main is green (REQ-D3).
name: Accessibility

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  level-a:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # governance-ref is the same immutable commit as the uses: pin.
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/accessibility.reusable.yml@6aa4b7d8546bf71a060a62d630c6f496a59d4853
    with:
      governance-ref: 6aa4b7d8546bf71a060a62d630c6f496a59d4853

  diff-hygiene:
    permissions:
      contents: read
      pull-requests: write
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/diff-hygiene.reusable.yml@6aa4b7d8546bf71a060a62d630c6f496a59d4853
    with:
      governance-ref: 6aa4b7d8546bf71a060a62d630c6f496a59d4853
