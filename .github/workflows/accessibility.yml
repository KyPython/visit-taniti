# Accessibility + diff-hygiene gate (grace mode during rollout).
# Consumes the shared reusable workflows from KyLamportLogic/buildlogic-governance.
# Grace mode: runs and reports but does not block merge until branch protection
# is enabled by a human after main is green (REQ-D3).
name: Accessibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  level-a:
    # governance-ref pinned to the rollout branch until PR #13 merges to main,
    # then repin to the merged commit SHA (REQ-A6/J3).
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/accessibility.reusable.yml@spec/accessibility-enforcement
    with:
      governance-ref: spec/accessibility-enforcement

  diff-hygiene:
    uses: KyLamportLogic/buildlogic-governance/.github/workflows/diff-hygiene.reusable.yml@spec/accessibility-enforcement
    with:
      governance-ref: spec/accessibility-enforcement
